version: 2
updates:
  # Security updates only (open-pull-requests-limit: 0 disables version updates).
  # One entry per manifest directory so security bumps group into one PR per lockfile.
  # Add new manifest locations here as they appear.
  - package-ecosystem: "npm"
    directory: "/.github/scripts/release"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
